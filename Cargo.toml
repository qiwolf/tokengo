[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/server",
    "crates/cli",
    "crates/web",
]

[workspace.package]
version = "0.28.2"
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["tokengo"]

[workspace.dependencies]
# 序列化 / 错误 / 日志
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 稳定会话 ID 用（sha2 本来就在依赖树里，由 rustls 带进来，等于零新增编译成本）
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# HTTP 服务端
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit"] }

# HTTP 客户端（打上游）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# 本地 crate
tokengo-shared = { path = "crates/shared" }

# 本机开发/验证用的产物。默认 full 调试符号会让单个二进制膨胀到上百兆
# （tokengo-server 122M、tokengo_web.so 133M、libtokengo_web.rlib 180M），
# cargo 又不回收旧产物 —— 两天 26 批编译就能把 target/ 滚到 27G。
# 改成只留行号级调试信息、第三方依赖不带调试信息，单产物回落到几十兆。
[profile.dev]
debug = 1
# Keep development disk use bounded; dependencies still use Cargo's normal cache.
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# 面板（wasm）单独调成「优先体积」：服务端继续用 opt-level = 3（性能要紧），
# 两边互不影响。面板是管理页，跑快跑慢看不出来，但每一次首次打开都要下它。
[profile.release.package.tokengo-web]
opt-level = "z"
