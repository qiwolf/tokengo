[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/server",
    "crates/cli",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
authors = ["tokengo"]

[workspace.dependencies]
# 序列化 / 错误 / 日志
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP 服务端
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit"] }

# HTTP 客户端（打上游）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# 本地 crate
tokengo-shared = { path = "crates/shared" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
