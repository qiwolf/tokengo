[package]
name = "tokengo-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "tokengo 面板（Rust/WASM，Leptos CSR）"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tokengo-web"
path = "src/main.rs"

[dependencies]
tokengo-shared.workspace = true
serde.workspace = true
serde_json.workspace = true

# 面板框架：Leptos CSR（Rust → WASM），界面不在 JS 里，也不依赖 npm。
# 构建：`trunk build --release`（产物在 crates/web/dist，由服务端从磁盘服务）
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "RequestCredentials",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "Storage",
    "Location",
    "Navigator",
    "Clipboard",
    "MediaQueryList",  # 首次访问时读系统的深色/浅色偏好
] }
