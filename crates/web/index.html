<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token-Go 控制台</title>
    <meta name="description" content="Token-Go 私有网关控制台，管理账号、模型来源、密钥与用量。" />
    <meta name="robots" content="noindex, nofollow" />
    <link id="console-canonical" rel="canonical" href="/ui/" />
    <meta id="console-og-url" property="og:url" content="/ui/" />
    <!--
      主题要在 WASM 起来之前先定好，否则每次刷新都会闪一下深色。
      这段读的键和 Rust 侧（lib.rs 的 THEME_KEY）必须是同一个：tokengo.theme。
      取值只有 light / dark；没记录过就跟随系统设置。
    -->
    <script>
      (function () {
        var u = window.location.origin + "/ui/";
        document.getElementById("console-canonical").setAttribute("href", u);
        document.getElementById("console-og-url").setAttribute("content", u);
        var t = null;
        try { t = localStorage.getItem("tokengo.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <!--
      data-bin：这个仓库里有两个 wasm 产物（lib 的 cdylib 和 bin），不点名 trunk 会报
      "found more than one target artifact"。
      data-wasm-opt-params：rustc 1.98 发出来的 wasm 用了 bulk memory / nontrapping
      浮点转换等特性，而 trunk 自带的 wasm-opt 是 2023 年的 v123，默认不认这些特性，
      会直接验证失败。这些特性主流浏览器都支持，显式打开即可。
    -->
    <link
      data-trunk
      rel="rust"
      data-bin="tokengo-web"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-reference-types --enable-multivalue --enable-extended-const --enable-nontrapping-float-to-int --enable-sign-ext"
    />
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="css" href="console-design.css" />
    <link data-trunk rel="css" href="provider-workspace.css" />
    <link data-trunk rel="copy-dir" href="family-logos" />
    <link data-trunk rel="css" href="account-workspace.css" />
  </head>
  <body>
    <noscript>面板需要 JavaScript（WASM 也得靠它加载）。</noscript>
  </body>
</html>
