[package]
name = "tokengo-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "tokengo 网关服务端（FreeLLMAPI 的 Rust 全量移植）"
default-run = "tokengo-server"

[lib]
name = "tokengo_server"
path = "src/lib.rs"

[[bin]]
