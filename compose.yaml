services:
  tokengo:
    image: ${TOKENGO_IMAGE:-tokengo:local}
    build:
      context: .
      target: runtime
      args:
        VCS_REF: ${TOKENGO_REVISION:-unknown}
    restart: unless-stopped
    init: true
    ports:
      - "${TOKENGO_BIND:-127.0.0.1}:${TOKENGO_PORT:-3160}:3160"
    volumes:
      - tokengo-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 150s
    environment:
      TOKENGO_LISTEN: 0.0.0.0:3160
      TOKENGO_DB: /data/tokengo.db
      TOKENGO_MASTER_KEY_FILE: /data/master.key
      TOKENGO_WEB_DIR: /opt/tokengo/web
      TOKENGO_LOG_DIR: /data/logs
      TOKENGO_SHUTDOWN_TIMEOUT_SECS: "120"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  tokengo-data:
