name: Linux release package

'on':
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.0'
  TRUNK_VERSION: '0.21.14'
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release-check:
    name: Linux x86_64 server and WASM, same commit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as ci.yml
        with:
          persist-credentials: false
      - name: Install Linux C toolchain and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev python3
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown,x86_64-unknown-linux-gnu
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, same pin as ci.yml
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-release-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Trunk
        run: cargo +"$RUST_TOOLCHAIN" install --locked --version "$TRUNK_VERSION" trunk
      - name: Verify deploy helpers without systemd mutations
        run: |
          bash -n deploy/build-release.sh
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          # Verify directives with an existing inert executable; the real release
          # path is absent on the build runner and is checked during LXC install.
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' deploy/tokengo.service > "$RUNNER_TEMP/tokengo.service"
          systemd-analyze verify "$RUNNER_TEMP/tokengo.service"
      - name: Build and package both release halves
        run: bash deploy/build-release.sh "$RUNNER_TEMP/tokengo-release"
      - name: Verify archive and architecture
        run: |
          cd "$RUNNER_TEMP/tokengo-release"
          sha256sum --check ./*.sha256
          python3 "$GITHUB_WORKSPACE/deploy/manage.py" verify ./*.tar.gz
      - name: Build container from the verified Linux bundle
        run: |
          context="$RUNNER_TEMP/tokengo-container"
          mkdir -p "$context/deploy/container" "$context/bundle"
          cp Dockerfile LICENSE NOTICE .dockerignore "$context/"
          cp deploy/container/healthcheck.sh "$context/deploy/container/"
          tar -xzf "$RUNNER_TEMP"/tokengo-release/*.tar.gz --strip-components=1 -C "$context/bundle"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["commit"] == sys.argv[2]' "$context/bundle/manifest.json" "$GITHUB_SHA"
          docker build --platform linux/amd64 --target release-runtime \
            --build-arg VCS_REF="$GITHUB_SHA" -t "tokengo:sha-$GITHUB_SHA" "$context"
      - name: Verify isolated container lifecycle and persistence
        run: python3 deploy/container/smoke.py "tokengo:sha-$GITHUB_SHA"
      - name: Export offline container image and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/tokengo-image"
          docker save "tokengo:sha-$GITHUB_SHA" | gzip > "$RUNNER_TEMP/tokengo-image/tokengo-$GITHUB_SHA-linux-amd64.tar.gz"
          cp compose.yaml "$RUNNER_TEMP/tokengo-image/"
          cp deploy/container.env.example "$RUNNER_TEMP/tokengo-image/"
          cp docs/container-deployment.md "$RUNNER_TEMP/tokengo-image/"
          docker image inspect "tokengo:sha-$GITHUB_SHA" --format '{{json .}}' | \
            python3 -c 'import json,sys; x=json.load(sys.stdin); print(json.dumps({"source_commit": x["Config"]["Labels"]["org.opencontainers.image.revision"], "image_id": x["Id"], "os": x["Os"], "architecture": x["Architecture"]}, indent=2))' \
            > "$RUNNER_TEMP/tokengo-image/image-manifest.json"
          cd "$RUNNER_TEMP/tokengo-image"
          sha256sum ./*.tar.gz compose.yaml container.env.example container-deployment.md image-manifest.json > image-SHA256SUMS
      - name: Retain distributable image (no registry push or deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengo-image-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/tokengo-image/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain reviewable bundle (no publishing or deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengo-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/tokengo-release/*
          if-no-files-found: error
          retention-days: 14
