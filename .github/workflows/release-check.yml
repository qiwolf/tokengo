name: Linux release package

'on':
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.98.0'
  TRUNK_VERSION: '0.21.14'
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  release-check:
    name: Linux x86_64 server and WASM, same commit
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same pin as ci.yml
        with:
          persist-credentials: false
      - name: Install Linux C toolchain and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libssl-dev python3
      - name: Install pinned Rust and WASM target
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown,x86_64-unknown-linux-gnu
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, same pin as ci.yml
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-release-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install pinned Trunk
        run: cargo +"$RUST_TOOLCHAIN" install --locked --version "$TRUNK_VERSION" trunk
      - name: Verify deploy helpers without systemd mutations
        run: |
          bash -n deploy/build-release.sh
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
          python3 -m unittest discover -s deploy/container -p 'test_*.py' -v
          # Verify directives with an existing inert executable; the real release
          # path is absent on the build runner and is checked during LXC install.
          sed 's|^ExecStart=.*|ExecStart=/usr/bin/true|' deploy/tokengo.service > "$RUNNER_TEMP/tokengo.service"
          systemd-analyze verify "$RUNNER_TEMP/tokengo.service"
      - name: Build and package both release halves
        run: bash deploy/build-release.sh "$RUNNER_TEMP/tokengo-release"
      - name: Verify archive and architecture
        run: |
          cd "$RUNNER_TEMP/tokengo-release"
          sha256sum --check ./*.sha256
          python3 "$GITHUB_WORKSPACE/deploy/manage.py" verify ./*.tar.gz
      - name: Build container from the verified Linux bundle
        run: |
          context="$RUNNER_TEMP/tokengo-container"
          mkdir -p "$context/deploy/container" "$context/bundle"
          cp Dockerfile LICENSE NOTICE .dockerignore "$context/"
          cp deploy/container/healthcheck.sh "$context/deploy/container/"
          tar -xzf "$RUNNER_TEMP"/tokengo-release/*.tar.gz --strip-components=1 -C "$context/bundle"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["commit"] == sys.argv[2]' "$context/bundle/manifest.json" "$GITHUB_SHA"
          docker build --platform linux/amd64 --target release-runtime \
            --build-arg VCS_REF="$GITHUB_SHA" -t "tokengo:sha-$GITHUB_SHA" "$context"
      - name: Verify isolated container lifecycle and persistence
        run: python3 deploy/container/smoke.py "tokengo:sha-$GITHUB_SHA"
      - name: Export offline container image and checksum
        run: |
          mkdir -p "$RUNNER_TEMP/tokengo-image"
          release_image="$(python3 deploy/container/release_config.py "$GITHUB_SHA" "$RUNNER_TEMP/tokengo-image")"
          docker tag "tokengo:sha-$GITHUB_SHA" "$release_image"
          docker save "tokengo:sha-$GITHUB_SHA" "$release_image" | gzip > "$RUNNER_TEMP/tokengo-image/tokengo-$GITHUB_SHA-linux-amd64.tar.gz"
          cp docs/container-deployment.md "$RUNNER_TEMP/tokengo-image/"
          docker image inspect "tokengo:sha-$GITHUB_SHA" --format '{{json .}}' | \
            python3 -c 'import json,sys; x=json.load(sys.stdin); print(json.dumps({"source_commit": x["Config"]["Labels"]["org.opencontainers.image.revision"], "image_id": x["Id"], "os": x["Os"], "architecture": x["Architecture"]}, indent=2))' \
            > "$RUNNER_TEMP/tokengo-image/image-manifest.json"
          cd "$RUNNER_TEMP/tokengo-image"
          sha256sum ./*.tar.gz compose.yaml container.env.example container-deployment.md image-manifest.json > image-SHA256SUMS
      - name: Retain distributable image (no registry push or deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengo-image-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/tokengo-image/*
          if-no-files-found: error
          retention-days: 14
      - name: Retain reviewable bundle (no publishing or deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tokengo-linux-x86_64-${{ github.sha }}
          path: ${{ runner.temp }}/tokengo-release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified native package and GHCR image
    needs: release-check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-qiwolf.') && github.repository == 'qiwolf/tokengo'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download native package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tokengo-linux-x86_64-${{ github.sha }}
          path: release/native
      - name: Download container package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tokengo-image-linux-amd64-${{ github.sha }}
          path: release/image
      - name: Verify exact release inputs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release/native && sha256sum --check ./*.sha256)
          (cd release/image && sha256sum --check image-SHA256SUMS)
          python3 deploy/manage.py verify release/native/*.tar.gz
          python3 - <<'PY'
          import json, os, tarfile
          from pathlib import Path
          sha = os.environ['GITHUB_SHA']
          with tarfile.open(next(Path('release/native').glob('*.tar.gz'))) as archive:
              manifests = [m for m in archive.getmembers() if m.name.count('/') == 1 and m.name.endswith('/manifest.json')]
              assert len(manifests) == 1
              assert json.load(archive.extractfile(manifests[0]))['commit'] == sha
          image = json.loads(Path('release/image/image-manifest.json').read_text())
          assert image['source_commit'] == sha and image['architecture'] == 'amd64' and image['os'] == 'linux'
          assert Path('docs/releases/' + os.environ['RELEASE_TAG'] + '.md').is_file()
          PY
      - name: Load verified offline image
        run: |
          docker load -i release/image/tokengo-$GITHUB_SHA-linux-amd64.tar.gz
          test "$(docker image inspect tokengo:sha-$GITHUB_SHA --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect tokengo:sha-$GITHUB_SHA --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/ci.yml/runs?head_sha={os.environ['GITHUB_SHA']}&event=push&per_page=20"
          for _ in range(60):
              data = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
              runs = [r for r in data['workflow_runs'] if r['head_branch'] == 'main']
              if any(r['conclusion'] == 'success' for r in runs):
                  print('Exact-commit main Rust/WASM CI passed')
                  break
              if runs and all(r['status'] == 'completed' for r in runs):
                  raise SystemExit('Exact-commit main CI did not pass; nothing published')
              time.sleep(10)
          else:
              raise SystemExit('Exact-commit main CI not successful within 10 minutes; nothing published')
          PY
      - name: Push version, commit and latest image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "$RELEASE_TAG" "sha-$GITHUB_SHA" latest; do
            docker tag "tokengo:sha-$GITHUB_SHA" "$image:$tag"
            docker push "$image:$tag"
          done
          digest="$(docker image inspect "$image:$RELEASE_TAG" --format '{{index .RepoDigests 0}}')"
          test "${digest%@*}" = "$image"
          echo "PUBLISHED_IMAGE=$digest" >> "$GITHUB_ENV"
          docker pull "$digest"
          test "$(docker image inspect "$digest" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          printf '%s\n' "$digest" > release/image/registry-image.txt
          (cd release/image && sha256sum registry-image.txt >> image-SHA256SUMS)
      - name: Test the registry image with a disposable data volume
        run: python3 deploy/container/smoke.py "$PUBLISHED_IMAGE"
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          printf '\n发布源码提交：`%s`。\n\n容器镜像：`%s`。\n' "$GITHUB_SHA" "$PUBLISHED_IMAGE" >> release-notes.md
          gh release create "$RELEASE_TAG" release/native/* release/image/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: Log out from registry
        if: always()
        run: docker logout ghcr.io
